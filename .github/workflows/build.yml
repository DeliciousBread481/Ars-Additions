name: Build  
  
on:  
  push:  
    branches: [ "1.20.1-test" ]  
  pull_request:  
    branches: [ "1.20.1-test" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
      
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  
        
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
        with:  
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/1.20.1' }}  
        
      - name: Grant execute permission for gradlew  
        run: chmod +x gradlew  
        
      - name: Build with Gradle  
        run: ./gradlew build --no-daemon  
        
      - name: Get version  
        id: version  
        run: echo "version=$(cat version)" >> $GITHUB_OUTPUT  
        
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: ars_additions-${{ steps.version.outputs.version }}  
          path: |  
            build/libs/*.jar  
            !build/libs/*-sources.jar  
            !build/libs/*-dev.jar  
          retention-days: 30  
        
      - name: Upload sources jar  
        uses: actions/upload-artifact@v4  
        with:  
          name: ars_additions-${{ steps.version.outputs.version }}-sources  
          path: build/libs/*-sources.jar  
          retention-days: 30